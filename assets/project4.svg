<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#071525"/>
    </linearGradient>
    <filter id="glow4"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="pulse4"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  <!-- bg orbs -->
  <circle cx="650" cy="200" r="200" fill="#f97316" opacity="0.04"/>
  <circle cx="150" cy="350" r="160" fill="#eab308" opacity="0.04"/>

  <!-- navbar -->
  <rect x="0" y="0" width="800" height="54" fill="rgba(5,8,16,0.98)"/>
  <rect x="0" y="53" width="800" height="1" fill="rgba(249,115,22,0.15)"/>
  <rect x="22" y="13" width="32" height="32" rx="6" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.5)" stroke-width="1"/>
  <text x="38" y="34" font-family="sans-serif" font-size="14" font-weight="900" fill="#f97316" text-anchor="middle">V</text>
  <text x="62" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Ventura</text>
  <text x="112" y="34" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Logistics</text>
  <text x="520" y="34" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Tracking</text>
  <text x="580" y="34" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Shipments</text>
  <text x="648" y="34" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Analytics</text>
  <rect x="716" y="16" width="62" height="26" rx="6" fill="rgba(249,115,22,0.2)" stroke="rgba(249,115,22,0.5)" stroke-width="1"/>
  <text x="747" y="33" font-family="sans-serif" font-size="10" fill="#f97316" text-anchor="middle" font-weight="600">+ Shipment</text>

  <!-- Global map panel (main hero) -->
  <rect x="22" y="68" width="490" height="290" rx="16" fill="url(#mapGrad)" stroke="rgba(249,115,22,0.15)" stroke-width="1"/>
  <text x="40" y="94" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" font-weight="600">LIVE SHIPMENT TRACKER</text>
  <text x="472" y="94" font-family="sans-serif" font-size="9" fill="#f97316">● 24 Live</text>

  <!-- Stylized world map grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1" fill="none">
    <line x1="40" y1="108" x2="500" y2="108"/>
    <line x1="40" y1="140" x2="500" y2="140"/>
    <line x1="40" y1="172" x2="500" y2="172"/>
    <line x1="40" y1="204" x2="500" y2="204"/>
    <line x1="40" y1="236" x2="500" y2="236"/>
    <line x1="40" y1="268" x2="500" y2="268"/>
    <line x1="40" y1="300" x2="500" y2="300"/>
    <line x1="40" y1="332" x2="500" y2="332"/>
    <line x1="100" y1="108" x2="100" y2="340"/>
    <line x1="160" y1="108" x2="160" y2="340"/>
    <line x1="220" y1="108" x2="220" y2="340"/>
    <line x1="280" y1="108" x2="280" y2="340"/>
    <line x1="340" y1="108" x2="340" y2="340"/>
    <line x1="400" y1="108" x2="400" y2="340"/>
    <line x1="460" y1="108" x2="460" y2="340"/>
  </g>

  <!-- Continent blobs (stylized) -->
  <!-- North America -->
  <ellipse cx="115" cy="185" rx="55" ry="55" fill="rgba(249,115,22,0.08)" stroke="rgba(249,115,22,0.15)" stroke-width="1"/>
  <!-- Europe -->
  <ellipse cx="255" cy="165" rx="35" ry="40" fill="rgba(234,179,8,0.08)" stroke="rgba(234,179,8,0.12)" stroke-width="1"/>
  <!-- Asia -->
  <ellipse cx="390" cy="175" rx="70" ry="60" fill="rgba(249,115,22,0.06)" stroke="rgba(249,115,22,0.1)" stroke-width="1"/>
  <!-- Africa -->
  <ellipse cx="255" cy="250" rx="35" ry="50" fill="rgba(234,179,8,0.06)" stroke="rgba(234,179,8,0.1)" stroke-width="1"/>
  <!-- Australia -->
  <ellipse cx="440" cy="280" rx="30" ry="22" fill="rgba(249,115,22,0.06)" stroke="rgba(249,115,22,0.1)" stroke-width="1"/>

  <!-- Route lines with glow -->
  <!-- Delhi to London -->
  <path d="M380,175 Q310,130 255,168" fill="none" stroke="rgba(249,115,22,0.5)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- London to New York -->
  <path d="M240,165 Q180,140 120,190" fill="none" stroke="rgba(234,179,8,0.5)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- Delhi to Sydney -->
  <path d="M380,180 Q420,230 442,275" fill="none" stroke="rgba(249,115,22,0.4)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- Mumbai to Dubai -->
  <path d="M370,195 Q345,185 320,175" fill="none" stroke="rgba(16,185,129,0.5)" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Location pins -->
  <!-- Delhi -->
  <circle cx="380" cy="178" r="8" fill="rgba(249,115,22,0.3)" filter="url(#pulse4)"/>
  <circle cx="380" cy="178" r="5" fill="#f97316" filter="url(#glow4)"/>
  <rect x="386" y="165" width="50" height="18" rx="5" fill="rgba(0,0,0,0.7)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
  <text x="411" y="178" font-family="sans-serif" font-size="8" fill="#f97316" text-anchor="middle">New Delhi</text>

  <!-- London -->
  <circle cx="240" cy="163" r="6" fill="rgba(234,179,8,0.3)" filter="url(#pulse4)"/>
  <circle cx="240" cy="163" r="4" fill="#eab308" filter="url(#glow4)"/>
  <rect x="246" y="153" width="46" height="16" rx="5" fill="rgba(0,0,0,0.7)" stroke="rgba(234,179,8,0.4)" stroke-width="1"/>
  <text x="269" y="165" font-family="sans-serif" font-size="8" fill="#eab308" text-anchor="middle">London</text>

  <!-- New York -->
  <circle cx="120" cy="190" r="6" fill="rgba(249,115,22,0.3)" filter="url(#pulse4)"/>
  <circle cx="120" cy="190" r="4" fill="#f97316" filter="url(#glow4)"/>

  <!-- Sydney -->
  <circle cx="443" cy="278" r="5" fill="rgba(16,185,129,0.3)" filter="url(#pulse4)"/>
  <circle cx="443" cy="278" r="3" fill="#10b981" filter="url(#glow4)"/>

  <!-- Moving truck indicator -->
  <rect x="300" y="146" width="18" height="12" rx="3" fill="#f97316"/>
  <text x="309" y="156" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#fff">🚛</text>

  <!-- Map legend -->
  <text x="40" y="358" font-family="sans-serif" font-size="9" fill="#f97316">● Active Route</text>
  <text x="120" y="358" font-family="sans-serif" font-size="9" fill="#eab308">● In Transit</text>
  <text x="198" y="358" font-family="sans-serif" font-size="9" fill="#10b981">● Delivered</text>

  <!-- Right panels -->
  <rect x="524" y="68" width="254" height="130" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(249,115,22,0.15)" stroke-width="1"/>
  <text x="542" y="92" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">TODAY'S OVERVIEW</text>
  <text x="542" y="128" font-family="sans-serif" font-size="32" font-weight="900" fill="#fff">1,842</text>
  <text x="542" y="148" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Active shipments</text>
  <text x="542" y="170" font-family="sans-serif" font-size="10" fill="#f97316">↑ +14% vs yesterday</text>

  <rect x="524" y="210" width="120" height="70" rx="12" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="584" y="234" font-family="sans-serif" font-size="18" text-anchor="middle">✅</text>
  <text x="584" y="254" font-family="sans-serif" font-size="13" font-weight="700" fill="#22c55e" text-anchor="middle">98.4%</text>
  <text x="584" y="270" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">On-Time</text>

  <rect x="656" y="210" width="122" height="70" rx="12" fill="rgba(249,115,22,0.08)" stroke="rgba(249,115,22,0.25)" stroke-width="1"/>
  <text x="717" y="234" font-family="sans-serif" font-size="18" text-anchor="middle">🌐</text>
  <text x="717" y="254" font-family="sans-serif" font-size="13" font-weight="700" fill="#f97316" text-anchor="middle">42 Countries</text>
  <text x="717" y="270" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">Coverage</text>

  <!-- Shipment status list -->
  <rect x="524" y="292" width="254" height="66" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(249,115,22,0.12)" stroke-width="1"/>
  <text x="542" y="314" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">RECENT</text>
  <text x="542" y="336" font-family="sans-serif" font-size="10" fill="#fff">VTL-42891</text>
  <text x="542" y="350" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">Delhi → London  ·  ETA: 2 days</text>
  <rect x="680" y="326" width="58" height="18" rx="9" fill="rgba(249,115,22,0.2)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
  <text x="709" y="339" font-family="sans-serif" font-size="8" fill="#f97316" text-anchor="middle">In Transit</text>

  <!-- Bottom stats -->
  <rect x="22" y="374" width="230" height="104" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(249,115,22,0.12)" stroke-width="1"/>
  <text x="40" y="398" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">TOTAL CARGO VALUE</text>
  <text x="40" y="438" font-family="sans-serif" font-size="28" font-weight="900" fill="#fff">$24.8M</text>
  <text x="40" y="458" font-family="sans-serif" font-size="10" fill="#f97316">This month · 6,242 orders</text>
  <text x="40" y="472" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">Across 42 countries</text>

  <rect x="264" y="374" width="250" height="104" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(234,179,8,0.12)" stroke-width="1"/>
  <text x="282" y="398" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">DELIVERY METRICS</text>
  <!-- mini bar chart -->
  <rect x="282" y="412" width="30" height="45" rx="4" fill="rgba(249,115,22,0.3)"/>
  <rect x="318" y="422" width="30" height="35" rx="4" fill="rgba(249,115,22,0.25)"/>
  <rect x="354" y="408" width="30" height="49" rx="4" fill="rgba(249,115,22,0.4)"/>
  <rect x="390" y="415" width="30" height="42" rx="4" fill="rgba(249,115,22,0.3)"/>
  <rect x="426" y="402" width="30" height="55" rx="4" fill="url(#orangeGrad)"/>
  <text x="282" y="468" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">Mon  Tue  Wed  Thu  Fri</text>

  <rect x="526" y="374" width="252" height="104" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(16,185,129,0.12)" stroke-width="1"/>
  <text x="544" y="398" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">FLEET STATUS</text>
  <text x="544" y="430" font-family="sans-serif" font-size="11" fill="#fff">🚛 Trucks: </text>
  <text x="620" y="430" font-family="sans-serif" font-size="11" fill="#22c55e">148 Active</text>
  <text x="544" y="450" font-family="sans-serif" font-size="11" fill="#fff">✈ Airfreight:</text>
  <text x="628" y="450" font-family="sans-serif" font-size="11" fill="#f97316">12 In-Air</text>
  <text x="544" y="470" font-family="sans-serif" font-size="11" fill="#fff">🚢 Sea: </text>
  <text x="594" y="470" font-family="sans-serif" font-size="11" fill="#06b6d4">8 Vessels</text>
</svg>
