<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#150822"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="productCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0d0920"/>
    </linearGradient>
    <filter id="glow1"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- orbs -->
  <circle cx="680" cy="120" r="160" fill="#8b5cf6" opacity="0.07"/>
  <circle cx="120" cy="420" r="140" fill="#00f0ff" opacity="0.05"/>
  <!-- nav bar -->
  <rect x="0" y="0" width="800" height="52" fill="rgba(10,10,26,0.95)" stroke="rgba(0,240,255,0.1)" stroke-width="0" stroke-dasharray="0"/>
  <rect x="0" y="51" width="800" height="1" fill="rgba(0,240,255,0.1)"/>
  <rect x="22" y="16" width="28" height="28" rx="6" fill="url(#cyanPurple)"/>
  <text x="36" y="35" font-family="sans-serif" font-size="12" font-weight="900" fill="#000" text-anchor="middle">A</text>
  <text x="58" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">APEX</text>
  <text x="92" y="32" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Fashion</text>
  <text x="550" y="32" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Shop</text>
  <text x="600" y="32" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Collections</text>
  <text x="665" y="32" font-family="sans-serif" font-size="11" fill="#00f0ff">Sale</text>
  <rect x="700" y="16" width="24" height="22" rx="5" fill="rgba(0,240,255,0.1)" stroke="rgba(0,240,255,0.3)" stroke-width="1"/>
  <text x="712" y="31" font-family="sans-serif" font-size="12" text-anchor="middle">🛒</text>
  <!-- Hero text -->
  <text x="32" y="110" font-family="sans-serif" font-size="11" fill="#00f0ff" letter-spacing="3" font-weight="600">NEW COLLECTION 2025</text>
  <text x="32" y="150" font-family="sans-serif" font-size="38" font-weight="900" fill="#fff">Redefine</text>
  <text x="32" y="195" font-family="sans-serif" font-size="38" font-weight="900" fill="url(#cyanPurple)">Your Style.</text>
  <text x="32" y="235" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" style="max-width:300px">Premium fashion that speaks for itself. Curated collections for those who lead.</text>
  <rect x="32" y="258" width="130" height="40" rx="10" fill="url(#cyanPurple)"/>
  <text x="97" y="283" font-family="sans-serif" font-size="13" font-weight="700" fill="#000" text-anchor="middle">Shop Now →</text>
  <rect x="174" y="258" width="120" height="40" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(0,240,255,0.3)" stroke-width="1"/>
  <text x="234" y="283" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">View All</text>
  <!-- Product cards row -->
  <text x="32" y="334" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="2">FEATURED PICKS</text>
  <!-- Card 1 -->
  <rect x="32" y="348" width="130" height="130" rx="14" fill="url(#productCard)" stroke="rgba(0,240,255,0.15)" stroke-width="1"/>
  <rect x="40" y="356" width="114" height="80" rx="8" fill="rgba(139,92,246,0.15)"/>
  <text x="97" y="406" font-family="sans-serif" font-size="26" text-anchor="middle">👗</text>
  <text x="42" y="448" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">Luxe Dress</text>
  <text x="42" y="464" font-family="sans-serif" font-size="11" fill="#00f0ff">₹4,200</text>
  <!-- Card 2 -->
  <rect x="174" y="348" width="130" height="130" rx="14" fill="url(#productCard)" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>
  <rect x="182" y="356" width="114" height="80" rx="8" fill="rgba(0,240,255,0.12)"/>
  <text x="239" y="406" font-family="sans-serif" font-size="26" text-anchor="middle">👔</text>
  <text x="184" y="448" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">Slim Suit</text>
  <text x="184" y="464" font-family="sans-serif" font-size="11" fill="#8b5cf6">₹7,500</text>
  <rect x="250" y="348" width="20" height="20" rx="10" fill="#8b5cf6"/>
  <text x="260" y="362" font-family="sans-serif" font-size="9" fill="#fff" text-anchor="middle">★</text>
  <!-- Card 3 -->
  <rect x="316" y="348" width="130" height="130" rx="14" fill="url(#productCard)" stroke="rgba(0,240,255,0.15)" stroke-width="1"/>
  <rect x="324" y="356" width="114" height="80" rx="8" fill="rgba(139,92,246,0.1)"/>
  <text x="381" y="406" font-family="sans-serif" font-size="26" text-anchor="middle">👟</text>
  <text x="326" y="448" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">Sneakers</text>
  <text x="326" y="464" font-family="sans-serif" font-size="11" fill="#00f0ff">₹3,900</text>
  <!-- Hero visual right -->
  <rect x="470" y="68" width="310" height="400" rx="20" fill="rgba(30,16,53,0.6)" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <!-- model silhouette placeholder -->
  <rect x="490" y="88" width="270" height="360" rx="14" fill="rgba(20,8,40,0.8)"/>
  <!-- fashion illustration elements -->
  <ellipse cx="625" cy="200" rx="80" ry="120" fill="rgba(139,92,246,0.15)"/>
  <ellipse cx="625" cy="180" rx="40" ry="40" fill="rgba(0,240,255,0.08)"/>
  <text x="625" y="220" font-family="sans-serif" font-size="80" text-anchor="middle" opacity="0.5">👠</text>
  <text x="625" y="300" font-family="sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle">APEX</text>
  <text x="625" y="320" font-family="sans-serif" font-size="11" fill="rgba(0,240,255,0.5)" text-anchor="middle" letter-spacing="4">FASHION</text>
  <!-- floating badges -->
  <rect x="488" y="100" width="110" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
  <text x="543" y="123" font-family="sans-serif" font-size="11" fill="#00f0ff" text-anchor="middle">⚡ Free Shipping</text>
  <rect x="622" y="380" width="120" height="36" rx="18" fill="rgba(139,92,246,0.3)" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
  <text x="682" y="403" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle">🏷 30% OFF</text>
  <!-- Stars rating -->
  <text x="497" y="422" font-family="sans-serif" font-size="11" fill="#f59e0b">★★★★★</text>
  <text x="497" y="438" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">4.9 · 1,200+ reviews</text>
</svg>
