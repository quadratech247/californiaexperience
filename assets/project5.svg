  <rect x="480" y="376" width="258" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="480" y="376" width="186" height="6" rx="3" fill="url(#pinkGrad)"/>

  <text x="480" y="402" font-family="sans-serif" font-size="10" fill="#fff">Water Intake</text>
