  <text x="480" y="228" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="600">SLEEP ANALYSIS</text>
  <!-- Sleep wave -->
  <polyline points="476,280 500,250 524,268 548,238 572,262 596,242 620,258 644,235 668,255 692,240 716,260 736,245" fill="none" stroke="url(#pinkGrad)" stroke-width="2" stroke-linecap="round"/>
  <polyline points="476,280 500,250 524,268 548,238 572,262 596,242 620,258 644,235 668,255 692,240 716,260 736,245" fill="none" stroke="rgba(244,114,182,0.2)" stroke-width="8" stroke-linecap="round"/>
  <text x="480" y="295" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Deep  ●  Light  ●  REM</text>
  <text x="720" y="228" font-family="sans-serif" font-size="12" font-weight="800" fill="#fff">7h 42m</text>

  <!-- Goals progress -->
