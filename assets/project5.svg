  <text x="480" y="152" font-family="sans-serif" font-size="28" font-weight="800" fill="#fff">48,290</text>
  <text x="480" y="170" font-family="sans-serif" font-size="10" fill="#f472b6">↑ 14% this week</text>

  <rect x="614" y="90" width="140" height="90" rx="16" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
  <text x="634" y="120" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="600">CALORIES</text>
  <text x="634" y="152" font-family="sans-serif" font-size="28" font-weight="800" fill="#fff">2,840</text>
  <text x="634" y="170" font-family="sans-serif" font-size="10" fill="#a855f7">↑ 8% vs last wk</text>

