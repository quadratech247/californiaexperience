  <rect x="48" y="325" width="64" height="40" rx="10" fill="rgba(244,114,182,0.12)" stroke="rgba(244,114,182,0.3)" stroke-width="1"/>
  <text x="80" y="341" font-family="sans-serif" font-size="10" fill="#f472b6" text-anchor="middle">🔥</text>
  <text x="80" y="357" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">485</text>

  <rect x="120" y="325" width="64" height="40" rx="10" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
  <text x="152" y="341" font-family="sans-serif" font-size="10" fill="#a855f7" text-anchor="middle">👟</text>
  <text x="152" y="357" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">7,248</text>

