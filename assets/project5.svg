  <rect x="230" y="80" width="200" height="380" rx="28" fill="rgba(30,5,60,0.98)" stroke="url(#pinkGrad)" stroke-width="2"/>
  <rect x="242" y="92" width="176" height="356" rx="22" fill="rgba(15,2,35,0.95)"/>

