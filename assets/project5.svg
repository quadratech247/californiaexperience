  <text x="30" y="85" font-family="'DM Sans',sans-serif" font-size="13" fill="#f472b6" letter-spacing="2" font-weight="600">MOBILE APP DESIGN</text>

  <!-- Phone mockup 1 (left) -->
  <rect x="28" y="110" width="180" height="340" rx="24" fill="rgba(30,5,60,0.95)" stroke="#f472b6" stroke-width="1.5"/>
  <rect x="38" y="120" width="160" height="320" rx="18" fill="rgba(20,3,40,0.9)"/>

  <!-- Phone 1 - Status bar -->
  <text x="50" y="148" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">9:41</text>
  <circle cx="165" cy="143" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="155" cy="143" r="4" fill="rgba(255,255,255,0.15)"/>

  <!-- Phone 1 - Header -->
  <text x="50" y="175" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Good Morning,</text>
  <text x="50" y="192" font-family="sans-serif" font-size="11" fill="#f472b6">Rahul 👋</text>

  <!-- Phone 1 - Heart rate ring -->
  <circle cx="118" cy="265" r="52" fill="none" stroke="rgba(244,114,182,0.15)" stroke-width="10"/>
  <circle cx="118" cy="265" r="52" fill="none" stroke="url(#pinkGrad)" stroke-width="6" stroke-dasharray="245 80" stroke-dashoffset="-20" stroke-linecap="round"/>
  <!-- Heart icon -->
  <text x="103" y="260" font-size="20" fill="#f472b6">♥</text>
  <text x="105" y="280" font-family="sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">142</text>
  <text x="118" y="280" font-family="sans-serif" font-size="16" font-weight="800" fill="#fff"/>
  <text x="113" y="292" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.5)">BPM</text>

