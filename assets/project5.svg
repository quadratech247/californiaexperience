  <rect x="480" y="406" width="258" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="480" y="406" width="219" height="6" rx="3" fill="url(#pinkGrad)"/>

  <text x="480" y="432" font-family="sans-serif" font-size="10" fill="#fff">Active Minutes</text>
  <text x="726" y="432" font-family="sans-serif" font-size="10" fill="#f472b6" text-anchor="end">93%</text>
  <rect x="480" y="436" width="258" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="480" y="436" width="240" height="6" rx="3" fill="url(#pinkGrad)"/>

  <!-- Badge tag -->
  <rect x="460" y="450" width="134" height="28" rx="14" fill="rgba(244,114,182,0.15)" stroke="rgba(244,114,182,0.4)" stroke-width="1"/>
  <text x="527" y="469" font-family="sans-serif" font-size="11" fill="#f472b6" text-anchor="middle" font-weight="600">Mobile App Design</text>
</svg>
