    <rect x="361" y="145" width="16" height="105" rx="6" fill="url(#pinkGrad)"/>
    <rect x="386" y="200" width="16" height="50" rx="6" fill="url(#barGrad)" opacity="0.4"/>
    <rect x="401" y="220" width="16" height="30" rx="6" fill="url(#barGrad)" opacity="0.4"/>

