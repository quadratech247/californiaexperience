  <rect x="48" y="398" width="140" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="80" cy="412" r="8" fill="rgba(244,114,182,0.2)"/>
  <circle cx="118" cy="412" r="8" fill="rgba(244,114,182,0.5)"/>
  <circle cx="156" cy="412" r="8" fill="rgba(244,114,182,0.2)"/>

