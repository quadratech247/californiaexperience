  <text x="388" y="291" font-family="sans-serif" font-size="10" fill="#f472b6">✓</text>

  <rect x="252" y="326" width="176" height="52" rx="14" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.2)" stroke-width="1"/>
